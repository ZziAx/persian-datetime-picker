name: persian_datetime_picker
description: A persian (farsi,shamsi,jalali) datetime picker for flutter, inspired by material datetime picker.
version: 3.1.0

homepage: https://github.com/M-amir-M/persian-datetime-picker

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shamsi_date: ^1.0.4
  flutter_svg: ^2.2.2
  hexcolor: ^3.1.3
  auto_size_text: ^3.0.0
  persian_number_utility: ^1.1.6
  flutter_tenet_kit:
    git:
      url: https://github.com/ZziAx/flutter_tenet_kit.git

  tenet_svg_collection:
    git:
      url: https://github.com/ZziAx/tenet_svg_collection.git



dev_dependencies:
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter:

